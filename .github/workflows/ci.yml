# Layer 3 机器强制之一：CI 跑测试 + 类型检查。job 名必须是 "ci"（匹配分支保护 contexts）
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build   # TypeScript 类型检查（tsc --noEmit 等价）
      - run: npm test
