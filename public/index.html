<!doctype html>
<html lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pinbox · 书签管理</title>
    <style>
      :root {
        --bg: #0f1115;
        --card: #1a1d24;
        --fg: #e6e8ec;
        --muted: #8b90a0;
        --accent: #4f8cff;
        --border: #2a2e38;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", sans-serif;
        background: var(--bg);
        color: var(--fg);
      }
      header {
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        gap: 12px;
      }
      header h1 { font-size: 20px; margin: 0; }
      header span { color: var(--muted); font-size: 13px; }
      main { max-width: 860px; margin: 0 auto; padding: 24px; }
      .panel {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px;
        margin-bottom: 18px;
      }
      input, select, button {
        font: inherit;
        padding: 9px 11px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #11141a;
        color: var(--fg);
      }
      input:focus, select:focus { outline: 2px solid var(--accent); }
      .row { display: flex; gap: 8px; flex-wrap: wrap; }
      .row > * { flex: 1; min-width: 120px; }
      button {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
        cursor: pointer;
        flex: 0 0 auto;
      }
      button:hover { filter: brightness(1.08); }
      #search { width: 100%; }
      .bookmark {
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
        margin-bottom: 10px;
        background: #14171d;
      }
      .bookmark a { color: var(--accent); text-decoration: none; font-weight: 600; word-break: break-all; }
      .bookmark .title { font-weight: 600; margin-left: 8px; }
      .bookmark .desc { color: var(--muted); font-size: 13px; margin: 6px 0; }
      .chips { display: flex; gap: 6px; flex-wrap: wrap; }
      .chip {
        font-size: 12px;
        padding: 2px 8px;
        border-radius: 999px;
        background: #232838;
        color: var(--muted);
      }
      .chip-tag { background: #233044; color: #9ec5ff; }
      .chip-col { background: #2a2338; color: #d3b4ff; }
      .bookmark .edit-btn { margin-left: 8px; font-size: 12px; padding: 2px 8px; background: #2a2e38; border-color: #2a2e38; color: var(--muted); }
      .cancel-btn { background: #2a2e38; border-color: #2a2e38; color: var(--fg); }
      .sec-btn { background: #2a2e38; border-color: #2a2e38; color: var(--fg); }
      .empty { color: var(--muted); text-align: center; padding: 30px; }
    </style>
  </head>
  <body>
    <header>
      <h1>Pinbox</h1>
      <span>书签管理 · MVP</span>
    </header>
    <main>
      <section class="panel">
        <form id="addForm" class="row">
          <input id="url" placeholder="URL（必填）" required />
          <input id="title" placeholder="标题" />
          <input id="desc" placeholder="描述" />
          <input id="tags" placeholder="标签，逗号分隔" />
          <select id="collection"></select>
          <button type="submit" id="submitBtn">保存书签</button>
          <button type="button" id="cancelEdit" class="cancel-btn" style="display:none">取消</button>
        </form>
        <div class="row" style="margin-top: 8px">
          <input id="newCollection" placeholder="新建集合名" />
          <button type="button" id="addCollection">+ 新建集合</button>
        </div>
      </section>

      <section class="panel">
        <input id="search" placeholder="搜索书签（标题 / URL / 描述）…" />
        <div class="row" style="margin-top: 10px">
          <select id="filterTag"><option value="">全部标签</option></select>
          <select id="filterCollection"><option value="">全部集合</option></select>
          <button type="button" id="clearFilters" style="background:#2a2e38;border-color:#2a2e38;color:var(--fg)">清空筛选</button>
        </div>
        <div class="row" style="margin-top: 10px">
          <button type="button" id="exportBtn" class="sec-btn">导出 JSON</button>
          <button type="button" id="importBtn" class="sec-btn">导入 JSON</button>
          <input type="file" id="importFile" accept="application/json,.json" style="display:none" />
        </div>
      </section>

      <section id="list"></section>
    </main>

    <script>
      const $ = (id) => document.getElementById(id)
      let listData = []
      let editingId = null

      async function loadCollections() {
        const res = await fetch('/api/collections')
        const cols = await res.json()
        const opts = '<option value="">（无集合）</option>' +
          cols.map((c) => `<option value="${c.id}">${escapeHtml(c.name)}</option>`).join('')
        $('collection').innerHTML = opts
        $('filterCollection').innerHTML = '<option value="">全部集合</option>' +
          cols.map((c) => `<option value="${escapeHtml(c.name)}">${escapeHtml(c.name)}</option>`).join('')
      }

      async function loadTags() {
        const res = await fetch('/api/tags')
        const tags = await res.json()
        $('filterTag').innerHTML = '<option value="">全部标签</option>' +
          tags.map((t) => `<option value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('')
      }

      function chips(arr, cls) {
        if (!arr || !arr.length) return ''
        return '<div class="chips">' +
          arr.map((x) => `<span class="chip ${cls}">${escapeHtml(x)}</span>`).join('') +
          '</div>'
      }

      async function render(list) {
        listData = list
        const el = $('list')
        if (!list.length) {
          el.innerHTML = '<div class="empty">还没有书签，添加第一个吧。</div>'
          return
        }
        el.innerHTML = list
          .map(
            (b) => `
          <div class="bookmark">
            <a href="${escapeHtml(b.url)}" target="_blank" rel="noopener">${escapeHtml(b.url)}</a>
            <span class="title">${escapeHtml(b.title || '')}</span>
            <button class="edit-btn" data-id="${b.id}">编辑</button>
            ${b.description ? `<div class="desc">${escapeHtml(b.description)}</div>` : ''}
            ${chips(b.tags, 'chip-tag')}
            ${chips(b.collections, 'chip-col')}
          </div>`,
          )
          .join('')
      }

      function selectCollectionByName(name) {
        const sel = $('collection')
        sel.value = ''
        if (!name) return
        for (const opt of sel.options) {
          if (opt.textContent === name) { sel.value = opt.value; return }
        }
      }

      function startEdit(id) {
        const b = listData.find((x) => x.id === id)
        if (!b) return
        editingId = id
        $('url').value = b.url
        $('title').value = b.title || ''
        $('desc').value = b.description || ''
        $('tags').value = (b.tags || []).join(', ')
        selectCollectionByName((b.collections || [])[0] || '')
        $('submitBtn').textContent = '更新书签'
        $('cancelEdit').style.display = ''
        $('url').focus()
        window.scrollTo({ top: 0, behavior: 'smooth' })
      }

      function cancelEdit() {
        editingId = null
        $('addForm').reset()
        $('submitBtn').textContent = '保存书签'
        $('cancelEdit').style.display = 'none'
      }

      async function loadBookmarks() {
        const res = await fetch('/api/bookmarks')
        render(await res.json())
      }

      function buildQuery() {
        const q = new URLSearchParams()
        const text = $('search').value.trim()
        const tag = $('filterTag').value
        const col = $('filterCollection').value
        if (text) q.set('text', text)
        if (tag) q.set('tag', tag)
        if (col) q.set('collection', col)
        const s = q.toString()
        return s ? '/api/search?' + s : '/api/bookmarks'
      }

      async function applyFilters() {
        const res = await fetch(buildQuery())
        render(await res.json())
      }

      function escapeHtml(s) {
        return String(s).replace(/[&<>"']/g, (c) =>
          ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]),
        )
      }

      $('addForm').addEventListener('submit', async (e) => {
        e.preventDefault()
        const tags = $('tags').value.split(',').map((t) => t.trim()).filter(Boolean)
        const collection = $('collection').value
        const body = {
          url: $('url').value,
          title: $('title').value,
          description: $('desc').value,
          tags,
          collections: collection ? [Number(collection)] : [],
        }
        const method = editingId ? 'PUT' : 'POST'
        const url = editingId ? '/api/bookmarks/' + editingId : '/api/bookmarks'
        await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body),
        })
        cancelEdit()
        await loadBookmarks()
      })

      $('addCollection').addEventListener('click', async () => {
        const name = $('newCollection').value.trim()
        if (!name) return
        await fetch('/api/collections', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name }),
        })
        $('newCollection').value = ''
        await loadCollections()
      })

      let timer
      $('search').addEventListener('input', () => {
        clearTimeout(timer)
        timer = setTimeout(applyFilters, 250)
      })
      $('filterTag').addEventListener('change', applyFilters)
      $('filterCollection').addEventListener('change', applyFilters)
      $('clearFilters').addEventListener('click', () => {
        $('search').value = ''
        $('filterTag').value = ''
        $('filterCollection').value = ''
        loadBookmarks()
      })

      $('list').addEventListener('click', (e) => {
        const btn = e.target.closest('.edit-btn')
        if (btn) startEdit(Number(btn.dataset.id))
      })
      $('cancelEdit').addEventListener('click', cancelEdit)

      $('exportBtn').addEventListener('click', async () => {
        const res = await fetch('/api/export')
        const data = await res.json()
        const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' })
        const a = document.createElement('a')
        a.href = URL.createObjectURL(blob)
        a.download = 'pinbox-backup-' + new Date().toISOString().slice(0, 10) + '.json'
        a.click()
        URL.revokeObjectURL(a.href)
      })

      $('importBtn').addEventListener('click', () => $('importFile').click())
      $('importFile').addEventListener('change', async (e) => {
        const file = e.target.files[0]
        if (!file) return
        try {
          const data = JSON.parse(await file.text())
          const res = await fetch('/api/import', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data),
          })
          const result = await res.json()
          alert(res.ok ? `导入完成：新增 ${result.imported} 条书签` : `导入失败：${result.error || '数据格式错误'}`)
        } catch (err) {
          alert('导入失败：无法解析所选文件')
        }
        e.target.value = ''
        await Promise.all([loadBookmarks(), loadCollections(), loadTags()])
      })

      loadCollections()
      loadTags()
      loadBookmarks()
    </script>
  </body>
</html>
